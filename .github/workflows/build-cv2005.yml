name: Build CV2005 sensor library

on:
  push:
    branches: [master]
    paths:
      - 'libraries/sensor/hi3516cv6xx/cvsens_cv2005/**'
      - '.github/workflows/build-cv2005.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM Linux cross-compiler (soft-float)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabi

      - name: Build CV2005 sensor library
        working-directory: libraries/sensor/hi3516cv6xx/cvsens_cv2005
        env:
          CC: arm-linux-gnueabi-gcc
          AR: arm-linux-gnueabi-ar
        run: |
          make clean
          make

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cv2005-build
          path: |
            libraries/sensor/hi3516cv6xx/cvsens_cv2005/libsns_cv2005.so
            libraries/sensor/hi3516cv6xx/cvsens_cv2005/libsns_cv2005.a
